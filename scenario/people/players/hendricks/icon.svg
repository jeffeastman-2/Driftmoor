<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='hendricks token'>
<style>
.ring{fill:#ded2b8;stroke:#2c2118;stroke-width:3;}
.gold{fill:none;stroke:hsl(72 58% 58%);stroke-width:1.5;opacity:.72;}
.cloak{fill:#49506a;stroke:#2c2118;stroke-width:1.3;stroke-linejoin:round;}
.skin{fill:#e3c8b5;stroke:#2c2118;stroke-width:1.05;stroke-linejoin:round;}
.hair{fill:#d8d9de;stroke:#2c2118;stroke-width:1;stroke-linejoin:round;}
.ln{fill:none;stroke:#2c2118;stroke-width:1;stroke-linecap:round;}
.hl{fill:none;stroke:#d7d0c2;stroke-width:.8;opacity:.84;}
.eye{fill:#5b7db8;}
.horn{fill:#75615a;stroke:#2c2118;stroke-width:.9;}
.tooth{fill:#dfd9cc;stroke:#2c2118;stroke-width:.6;}
.scale{fill:#6f7b8d;stroke:#2c2118;stroke-width:.7;opacity:.8;}
</style>
