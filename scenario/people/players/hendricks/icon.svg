  <ellipse class='skin' cx='50' cy='45' rx='14' ry='15'/>
  
  <path class='hair' d='M36,47 q1,-15 14,-15 q13,0 14,15 q-5,-4 -14,-4 q-9,0 -14,4 Z'/>
  <circle class='eye' cx='44' cy='45' r='1.65'/><circle class='eye' cx='56' cy='45' r='1.65'/>
  <path class='ln' d='M41,41 q3,-2 6,-1 M53,40 q3,-1 6,1' stroke-width='.9'/>
  <line class='ln' x1='50' y1='47' x2='49' y2='51' stroke-width='.8'/>
