  <rect class='skin' x='44' y='58' width='12' height='14'/>
  <ellipse class='skin' cx='50' cy='45' rx='15' ry='17'/>
  <path class='hair' d='M34,48 q-2,-28 16,-28 q18,0 16,28 q-5,-14 -16,-14 q-11,0 -16,14 Z'/>
  <circle cx='44' cy='45' r='1.6'/><circle cx='56' cy='45' r='1.6'/>
  <path class='ln' d='M46,54 q4,2 8,0' stroke-width='.92'/>
</g>
<circle class='gold' cx='50' cy='50' r='42'/>
<text x='50' y='90' text-anchor='middle' font-family='Verdana, sans-serif' font-size='7' fill='#2d231b'>background</text>
