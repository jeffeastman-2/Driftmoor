<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'>
<style>
.ring{fill:#ddd4c6;stroke:#2d231b;stroke-width:3;}
.gold{fill:none;stroke:#9f8a60;stroke-width:1.5;opacity:.72;}
.cloak{fill:#5a6454;stroke:#2d231b;stroke-width:1.3;stroke-linejoin:round;}
.skin{fill:#cfa886;stroke:#2d231b;stroke-width:1.05;stroke-linejoin:round;}
.hair{fill:#4b3a2f;stroke:#2d231b;stroke-width:1;stroke-linejoin:round;}
.ln{fill:none;stroke:#2d231b;stroke-width:1;stroke-linecap:round;}
</style>
<circle class='ring' cx='50' cy='50' r='46.5'/>
