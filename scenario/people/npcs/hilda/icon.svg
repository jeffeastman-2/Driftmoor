  <rect class='skin' x='44' y='58' width='12' height='14'/>
  
  <ellipse class='hair' cx='64.5' cy='42.5' rx='6.5' ry='7.5'/><path class='hair' d='M34,47 q0,-22 16,-22 q16,0 16,22 q-5,-7 -16,-7 q-11,0 -16,7 Z'/>
  <ellipse class='skin' cx='50' cy='45' rx='17' ry='18'/>
  <circle class='eye' cx='44' cy='45' r='1.65'/><circle class='eye' cx='56' cy='45' r='1.65'/>
  <path class='ln' d='M41,40 q3,1 6,2 M53,42 q3,-1 6,-2' stroke-width='1'/>
