<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Obelisk Reach — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -11383.00 9116.00 11391.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 9100.00,-0.00 9100.00,-11375.00 0.00,-11375.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='4550.00' y='-5687.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='1300.00,-650.00 4550.00,-650.00 4550.00,-3250.00 1300.00,-3250.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='2925.00' y='-1950.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>APPROACH_PATH</text><polygon points='0.00,-0.00 9100.00,-0.00 9100.00,-11375.00 0.00,-11375.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4550.00' y='-5687.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>CLIFFS</text><polygon points='650.00,-3250.00 7150.00,-3250.00 7800.00,-10400.00 0.00,-10400.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='3900.00' y='-6825.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>CLIFF_PLATEAU</text><polygon points='3575.00,-5525.00 5200.00,-5525.00 5200.00,-7475.00 3575.00,-7475.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4387.50' y='-6500.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>ECHOING_CAVERNS</text><polygon points='2275.00,-6500.00 4225.00,-6500.00 4225.00,-8775.00 2275.00,-8775.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='3250.00' y='-7637.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHATTERED_OBELISK</text><polygon points='650.00,-3250.00 7800.00,-3250.00 7800.00,-10400.00 650.00,-10400.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Obelisk Distortion Field</title></polygon><polygon points='0.00,-4875.00 650.00,-4875.00 650.00,-11375.00 0.00,-11375.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Western cliff face</title></polygon><polygon points='7800.00,-4875.00 9100.00,-4875.00 9100.00,-11375.00 7800.00,-11375.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Eastern cliff drop</title></polygon><circle cx='3575.00' cy='-4225.00' r='1.2' fill='#3b3b3b'><title>obelisk_reach_edge</title></circle><text x='3576.70' y='-4226.30' class='lm-label'>obelisk_reach_edge</text><circle cx='3250.00' cy='-7475.00' r='1.2' fill='#3b3b3b'><title>shattered_obelisk</title></circle><text x='3251.70' y='-7476.30' class='lm-label'>shattered_obelisk</text><circle cx='4225.00' cy='-6500.00' r='1.2' fill='#3b3b3b'><title>echoing_caverns_mouth</title></circle><text x='4226.70' y='-6501.30' class='lm-label'>echoing_caverns_mouth</text><circle cx='2600.00' cy='-2600.00' r='1.2' fill='#3b3b3b'><title>cliff_approach</title></circle><text x='2601.70' y='-2601.30' class='lm-label'>cliff_approach</text><circle cx='1625.00' cy='-4875.00' r='1.2' fill='#3b3b3b'><title>symbol_cliff</title></circle><text x='1626.70' y='-4876.30' class='lm-label'>symbol_cliff</text><circle cx='3900.00' cy='-5200.00' r='1.2' fill='#3b3b3b'><title>narrow_path</title></circle><text x='3901.70' y='-5201.30' class='lm-label'>narrow_path</text><circle cx='3250.00' cy='-8125.00' r='1.2' fill='#3b3b3b'><title>scorched_ground</title></circle><text x='3251.70' y='-8126.30' class='lm-label'>scorched_ground</text><circle cx='5850.00' cy='-5850.00' r='1.2' fill='#3b3b3b'><title>outlook_ledge</title></circle><text x='5851.70' y='-5851.30' class='lm-label'>outlook_ledge</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
