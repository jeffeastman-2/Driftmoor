<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Willowford Bridge — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -138.00 178.00 146.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 162.00,-0.00 162.00,-130.00 0.00,-130.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='81.00' y='-65.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-84.00 162.00,-84.00 162.00,-130.00 0.00,-130.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='81.00' y='-107.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>NORTH_BANK</text><polygon points='0.00,-45.00 162.00,-45.00 162.00,-84.00 0.00,-84.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='81.00' y='-64.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>RIVER</text><polygon points='0.00,-0.00 162.00,-0.00 162.00,-45.00 0.00,-45.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='81.00' y='-22.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SOUTH_BANK</text><polygon points='65.00,-32.00 97.00,-32.00 97.00,-97.00 65.00,-97.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='81.00' y='-64.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>BRIDGE</text><polygon points='45.00,-26.00 71.00,-26.00 71.00,-42.00 45.00,-42.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='58.00' y='-34.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>TOLL_BOOTH</text><polygon points='0.00,-48.00 162.00,-48.00 162.00,-81.00 0.00,-81.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>River water</title></polygon><circle cx='81.00' cy='-39.00' r='1.2' fill='#3b3b3b'><title>bridge_south</title></circle><text x='82.70' y='-40.30' class='lm-label'>bridge_south</text><circle cx='81.00' cy='-65.00' r='1.2' fill='#3b3b3b'><title>bridge_center</title></circle><text x='82.70' y='-66.30' class='lm-label'>bridge_center</text><circle cx='81.00' cy='-91.00' r='1.2' fill='#3b3b3b'><title>bridge_north</title></circle><text x='82.70' y='-92.30' class='lm-label'>bridge_north</text><circle cx='58.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>toll_booth</title></circle><text x='59.70' y='-33.30' class='lm-label'>toll_booth</text><circle cx='32.00' cy='-26.00' r='1.2' fill='#3b3b3b'><title>willow_south</title></circle><text x='33.70' y='-27.30' class='lm-label'>willow_south</text><circle cx='32.00' cy='-104.00' r='1.2' fill='#3b3b3b'><title>willow_north</title></circle><text x='33.70' y='-105.30' class='lm-label'>willow_north</text><circle cx='26.00' cy='-65.00' r='1.2' fill='#3b3b3b'><title>ford_crossing</title></circle><text x='27.70' y='-66.30' class='lm-label'>ford_crossing</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
