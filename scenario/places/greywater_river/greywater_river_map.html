<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Greywater River — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -6508.00 9766.00 6516.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 9750.00,-0.00 9750.00,-6500.00 0.00,-6500.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='4875.00' y='-3250.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='325.00,-650.00 8775.00,-4875.00 8775.00,-6500.00 325.00,-6500.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4550.00' y='-4631.25' text-anchor='middle' dominant-baseline='middle' class='zone-label'>NORTH_BANK</text><polygon points='325.00,-162.00 8775.00,-4387.00 8775.00,-4875.00 325.00,-650.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4550.00' y='-2518.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>RIVER_CHANNEL</text><polygon points='325.00,-0.00 8775.00,-0.00 8775.00,-4387.00 325.00,-162.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4550.00' y='-1137.25' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SOUTH_BANK</text><polygon points='7475.00,-3900.00 8775.00,-3900.00 8775.00,-5200.00 7475.00,-5200.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='8125.00' y='-4550.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>OLD_MILL_AREA</text><polygon points='5200.00,-2275.00 6825.00,-2275.00 6825.00,-3575.00 5200.00,-3575.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='6012.50' y='-2925.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>WILLOWFORD</text><polygon points='325.00,-162.00 8775.00,-4387.00 8775.00,-4875.00 325.00,-650.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>River Crossing</title></polygon><polygon points='650.00,-260.00 8450.00,-4485.00 8450.00,-4777.00 650.00,-552.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>River deep channel</title></polygon><circle cx='650.00' cy='-325.00' r='1.2' fill='#3b3b3b'><title>river_mouth</title></circle><text x='651.70' y='-326.30' class='lm-label'>river_mouth</text><circle cx='6175.00' cy='-2925.00' r='1.2' fill='#3b3b3b'><title>willowford_bridge</title></circle><text x='6176.70' y='-2926.30' class='lm-label'>willowford_bridge</text><circle cx='5525.00' cy='-2275.00' r='1.2' fill='#3b3b3b'><title>willowford_ford</title></circle><text x='5526.70' y='-2276.30' class='lm-label'>willowford_ford</text><circle cx='8125.00' cy='-4550.00' r='1.2' fill='#3b3b3b'><title>old_mill</title></circle><text x='8126.70' y='-4551.30' class='lm-label'>old_mill</text><circle cx='2600.00' cy='-1300.00' r='1.2' fill='#3b3b3b'><title>willow_bend</title></circle><text x='2601.70' y='-1301.30' class='lm-label'>willow_bend</text><circle cx='1625.00' cy='-650.00' r='1.2' fill='#3b3b3b'><title>fishing_bank</title></circle><text x='1626.70' y='-651.30' class='lm-label'>fishing_bank</text><circle cx='4550.00' cy='-1950.00' r='1.2' fill='#3b3b3b'><title>farmers_landing</title></circle><text x='4551.70' y='-1951.30' class='lm-label'>farmers_landing</text><circle cx='3575.00' cy='-1787.00' r='1.2' fill='#3b3b3b'><title>otter_den</title></circle><text x='3576.70' y='-1788.30' class='lm-label'>otter_den</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
