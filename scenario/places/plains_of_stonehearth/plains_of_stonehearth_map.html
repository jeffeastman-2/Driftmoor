<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Plains Of Stonehearth — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -22758.00 54616.00 22766.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 54600.00,-0.00 54600.00,-22750.00 0.00,-22750.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='27300.00' y='-11375.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>OPEN_GRASSLAND</text><polygon points='4875.00,-14625.00 16250.00,-14625.00 16250.00,-21125.00 4875.00,-21125.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='10562.50' y='-17875.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>FARMLANDS</text><polygon points='9750.00,-9750.00 19500.00,-9750.00 19500.00,-16250.00 9750.00,-16250.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='14625.00' y='-13000.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>PASTURES</text><polygon points='27625.00,-6500.00 30875.00,-6500.00 30875.00,-9750.00 27625.00,-9750.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='29250.00' y='-8125.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>ROCKY_OUTCROP_E</text><polygon points='8125.00,-8125.00 11375.00,-8125.00 11375.00,-11375.00 8125.00,-11375.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='9750.00' y='-9750.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>ROCKY_OUTCROP_W</text><polygon points='9100.00,-8775.00 10400.00,-8775.00 10400.00,-10725.00 9100.00,-10725.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Rocky outcrop W cliffs</title></polygon><polygon points='28275.00,-7150.00 30225.00,-7150.00 30225.00,-9100.00 28275.00,-9100.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Rocky outcrop E cliffs</title></polygon><circle cx='22100.00' cy='-6500.00' r='1.2' fill='#3b3b3b'><title>plains_center</title></circle><text x='22101.70' y='-6501.30' class='lm-label'>plains_center</text><circle cx='6500.00' cy='-17875.00' r='1.2' fill='#3b3b3b'><title>northern_farmstead</title></circle><text x='6501.70' y='-17876.30' class='lm-label'>northern_farmstead</text><circle cx='16250.00' cy='-3250.00' r='1.2' fill='#3b3b3b'><title>southern_farmstead</title></circle><text x='16251.70' y='-3251.30' class='lm-label'>southern_farmstead</text><circle cx='9750.00' cy='-9750.00' r='1.2' fill='#3b3b3b'><title>rocky_outcrop_west</title></circle><text x='9751.70' y='-9751.30' class='lm-label'>rocky_outcrop_west</text><circle cx='29250.00' cy='-8125.00' r='1.2' fill='#3b3b3b'><title>rocky_outcrop_east</title></circle><text x='29251.70' y='-8126.30' class='lm-label'>rocky_outcrop_east</text><circle cx='13000.00' cy='-13000.00' r='1.2' fill='#3b3b3b'><title>sheep_pasture</title></circle><text x='13001.70' y='-13001.30' class='lm-label'>sheep_pasture</text><circle cx='26000.00' cy='-11375.00' r='1.2' fill='#3b3b3b'><title>shadowbeast_den</title></circle><text x='26001.70' y='-11376.30' class='lm-label'>shadowbeast_den</text><circle cx='1625.00' cy='-9750.00' r='1.2' fill='#3b3b3b'><title>coastal_path_west</title></circle><text x='1626.70' y='-9751.30' class='lm-label'>coastal_path_west</text><circle cx='3250.00' cy='-17875.00' r='1.2' fill='#3b3b3b'><title>road_to_driftmoor</title></circle><text x='3251.70' y='-17876.30' class='lm-label'>road_to_driftmoor</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
