<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Old Watchtower — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -105.00 113.00 113.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 97.00,-0.00 97.00,-97.00 0.00,-97.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='48.50' y='-48.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>FOREST</text><polygon points='9.00,-9.00 87.00,-9.00 87.00,-87.00 9.00,-87.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='48.00' y='-48.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>CLEARING</text><polygon points='35.00,-35.00 61.00,-35.00 61.00,-61.00 35.00,-61.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='48.00' y='-48.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>TOWER_INTERIOR</text><polygon points='32.00,-32.00 65.00,-32.00 65.00,-35.00 32.00,-35.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Tower walls</title></polygon><polygon points='52.00,-55.00 65.00,-55.00 65.00,-65.00 52.00,-65.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Collapsed section</title></polygon><circle cx='48.00' cy='-48.00' r='1.2' fill='#3b3b3b'><title>tower_base</title></circle><text x='49.70' y='-49.30' class='lm-label'>tower_base</text><circle cx='48.00' cy='-35.00' r='1.2' fill='#3b3b3b'><title>tower_entrance</title></circle><text x='49.70' y='-36.30' class='lm-label'>tower_entrance</text><circle cx='42.00' cy='-48.00' r='1.2' fill='#3b3b3b'><title>staircase</title></circle><text x='43.70' y='-49.30' class='lm-label'>staircase</text><circle cx='48.00' cy='-48.00' r='1.2' fill='#3b3b3b'><title>upper_level</title></circle><text x='49.70' y='-49.30' class='lm-label'>upper_level</text><circle cx='55.00' cy='-58.00' r='1.2' fill='#3b3b3b'><title>collapsed_section</title></circle><text x='56.70' y='-59.30' class='lm-label'>collapsed_section</text><circle cx='48.00' cy='-16.00' r='1.2' fill='#3b3b3b'><title>clearing_south</title></circle><text x='49.70' y='-17.30' class='lm-label'>clearing_south</text><circle cx='48.00' cy='-81.00' r='1.2' fill='#3b3b3b'><title>clearing_north</title></circle><text x='49.70' y='-82.30' class='lm-label'>clearing_north</text><circle cx='48.00' cy='-52.00' r='1.2' fill='#3b3b3b'><title>viewpoint</title></circle><text x='49.70' y='-53.30' class='lm-label'>viewpoint</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
