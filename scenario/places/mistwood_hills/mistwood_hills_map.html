<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Mistwood Hills — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -24383.00 22116.00 24391.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 22100.00,-0.00 22100.00,-24375.00 0.00,-24375.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='11050.00' y='-12187.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='4225.00,-4875.00 17225.00,-4875.00 17225.00,-19500.00 4225.00,-19500.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='10725.00' y='-12187.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>DEEP_INTERIOR</text><polygon points='0.00,-0.00 22100.00,-0.00 22100.00,-24375.00 0.00,-24375.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='11050.00' y='-12187.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>FOREST_EDGE</text><polygon points='5525.00,-7800.00 6825.00,-7800.00 6825.00,-9100.00 5525.00,-9100.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='6175.00' y='-8450.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>WATCHTOWER_HILL</text><polygon points='9659.00,-14163.00 9984.00,-14163.00 9984.00,-14488.00 9659.00,-14488.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='9821.50' y='-14325.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>FEY_GLADE</text><polygon points='4225.00,-4875.00 17225.00,-4875.00 17225.00,-19500.00 4225.00,-19500.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Mistwood Disorientation Zone</title></polygon><polygon points='6500.00,-11375.00 13000.00,-11375.00 13000.00,-17875.00 6500.00,-17875.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Dense interior thicket</title></polygon><circle cx='9100.00' cy='-11375.00' r='1.2' fill='#3b3b3b'><title>mistwood_center</title></circle><text x='9101.70' y='-11376.30' class='lm-label'>mistwood_center</text><circle cx='6175.00' cy='-8450.00' r='1.2' fill='#3b3b3b'><title>watchtower_hill</title></circle><text x='6176.70' y='-8451.30' class='lm-label'>watchtower_hill</text><circle cx='9821.00' cy='-14326.00' r='1.2' fill='#3b3b3b'><title>fey_glade</title></circle><text x='9822.70' y='-14327.30' class='lm-label'>fey_glade</text><circle cx='4875.00' cy='-1625.00' r='1.2' fill='#3b3b3b'><title>southern_edge</title></circle><text x='4876.70' y='-1626.30' class='lm-label'>southern_edge</text><circle cx='17875.00' cy='-9750.00' r='1.2' fill='#3b3b3b'><title>eastern_ridge</title></circle><text x='17876.70' y='-9751.30' class='lm-label'>eastern_ridge</text><circle cx='3250.00' cy='-2600.00' r='1.2' fill='#3b3b3b'><title>hunters_camp</title></circle><text x='3251.70' y='-2601.30' class='lm-label'>hunters_camp</text><circle cx='11375.00' cy='-16250.00' r='1.2' fill='#3b3b3b'><title>whispering_hollow</title></circle><text x='11376.70' y='-16251.30' class='lm-label'>whispering_hollow</text><circle cx='8125.00' cy='-14625.00' r='1.2' fill='#3b3b3b'><title>fog_valley</title></circle><text x='8126.70' y='-14626.30' class='lm-label'>fog_valley</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
