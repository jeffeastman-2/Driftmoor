<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Elyssa Cottage — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-27.00 -63.00 103.00 80.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-19.00,9.00 68.00,9.00 68.00,-55.00 -19.00,-55.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='24.50' y='-23.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='-13.00,-13.00 0.00,-13.00 0.00,-32.00 -13.00,-32.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='-6.50' y='-22.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>HERB_GARDEN</text><polygon points='0.00,-0.00 32.00,-0.00 32.00,-29.00 0.00,-29.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='16.00' y='-14.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>STUDY</text><polygon points='0.00,-29.00 32.00,-29.00 32.00,-45.0
