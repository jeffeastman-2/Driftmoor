<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Rusty Razor — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-17.00 -43.00 60.00 60.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-9.00,9.00 35.00,9.00 35.00,-35.00 -9.00,-35.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='13.00' y='-13.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-0.00 26.00,-0.00 26.00,-26.00 0.00,-26.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='13.00' y='-13.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHOP</text><polygon points='0.00,-22.00 26.00,-22.00 26.00,-26.00 0.00,-26.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Back wall</title></polygon><circle cx='13.00' cy='-0.00' r='1.2' fill='#3b3b3b'><title>front_door</title></circle><text x='14.70' y='-1.30' class='lm-label'>front_door</text><circle cx='9.00' cy='-13.00' r='1.2' fill='#3b3b3b'><title>barber_chair_3.25</title></circle><text x='10.70' y='-14.30' class='lm-label'>barber_chair_3.25</text><circle cx='19.00' cy='-13.00' r='1.2' fill='#3b3b3b'><title>barber_chair_6.5</title></circle><text x='20.70' y='-14.30' class='lm-label'>barber_chair_6.5</text><circle cx='13.00' cy='-22.00' r='1.2' fill='#3b3b3b'><title>mirror</title></circle><text x='14.70' y='-23.30' class='lm-label'>mirror</text><circle cx='3.00' cy='-19.00' r='1.2' fill='#3b3b3b'><title>tonic_shelf</title></circle><text x='4.70' y='-20.30' class='lm-label'>tonic_shelf</text><circle cx='16.00' cy='3.00' r='1.2' fill='#3b3b3b'><title>striped_pole</title></circle><text x='17.70' y='1.70' class='lm-label'>striped_pole</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
