<svg viewBox="0 0 80 188" xmlns="http://www.w3.org/2000/svg">
<style>
.o{fill:none;stroke:#2c2118;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;}
.st{fill:#cec3a9;stroke:#2c2118;stroke-width:1.3;stroke-linejoin:round;}
.dk{fill:#251f17;stroke:#2c2118;stroke-width:1;stroke-linejoin:round;}
.wd{fill:#b08a55;stroke:#2c2118;stroke-width:1.2;stroke-linejoin:round;}
.water{fill:#7c9db0;stroke:#2c2118;stroke-width:1.1;}
.thin{fill:none;stroke:#2c2118;stroke-width:0.7;opacity:.55;}
</style>
<!-- river flowing across, peeking out either side of the span -->
<rect class="water" x="0" y="62" width="16" height="56"/>
<rect class="water" x="64" y="62" width="16" height="56"/>
<path class="thin" d="M2,76 q7,-3 14,0 M2,92 q7,-3 14,0 M2,107 q7,-3 14,0 M64,76 q7,-3 14,0 M64,92 q7,-3 14,0 M64,107 q7,-3 14,0"/>
<!-- stone abutments where the bridge meets each bank -->
<rect class="st" x="10" y="2" width="60" height="16"/>
<rect class="st" x="10" y="170" width="60" height="16"/>
<line class="thin" x1="10" y1="10" x2="70" y2="10"/><line class="thin" x1="10" y1="178" x2="70" y2="178"/>
<!-- deck -->
<rect class="wd" x="16" y="18" width="48" height="152"/>
<line class="thin" x1="16" y1="30" x2="64" y2="30"/><line class="thin" x1="16" y1="46" x2="64" y2="46"/><line class="thin" x1="16" y1="62" x2="64" y2="62"/><line class="thin" x1="16" y1="78" x2="64" y2="78"/><line class="thin" x1="16" y1="94" x2="64" y2="94"/><line class="thin" x1="16" y1="110" x2="64" y2="110"/><line class="thin" x1="16" y1="126" x2="64" y2="126"/><line class="thin" x1="16" y1="142" x2="64" y2="142"/><line class="thin" x1="16" y1="158" x2="64" y2="158"/>
<!-- deck edges shadowed where they span the open water -->
<line class="thin" x1="16" y1="62" x2="16" y2="118" stroke-width="1.4"/><line class="thin" x1="64" y1="62" x2="64" y2="118" stroke-width="1.4"/>
<!-- railings -->
<rect class="wd" x="11" y="18" width="6" height="152"/>
<rect class="wd" x="63" y="18" width="6" height="152"/>
<g class="dk"><rect x="11" y="22" width="6" height="5"/><rect x="11" y="46" width="6" height="5"/><rect x="11" y="70" width="6" height="5"/><rect x="11" y="94" width="6" height="5"/><rect x="11" y="118" width="6" height="5"/><rect x="11" y="142" width="6" height="5"/><rect x="11" y="162" width="6" height="5"/><rect x="63" y="22" width="6" height="5"/><rect x="63" y="46" width="6" height="5"/><rect x="63" y="70" width="6" height="5"/><rect x="63" y="94" width="6" height="5"/><rect x="63" y="118" width="6" height="5"/><rect x="63" y="142" width="6" height="5"/><rect x="63" y="162" width="6" height="5"/></g>
</svg>
