<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>General Store — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-17.00 -76.00 80.00 93.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-9.00,9.00 55.00,9.00 55.00,-68.00 -9.00,-68.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='23.00' y='-29.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='6.00,-29.00 39.00,-29.00 39.00,-58.00 6.00,-58.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='22.50' y='-43.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>GARDEN</text><polygon points='0.00,-0.00 45.00,-0.00 45.00,-29.00 0.00,-29.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='22.50' y='-14.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHOP</text><polygon points='0.00,-26.00 45.00,-26.00 45.00,-29.00 0.00,-29.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Back wall</title></polygon><polygon points='6.00,-55.00 39.00,-55.00 39.00,-58.00 6.00,-58.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Garden fence</title></polygon><circle cx='22.00' cy='-0.00' r='1.2' fill='#3b3b3b'><title>front_door</title></circle><text x='23.70' y='-1.30' class='lm-label'>front_door</text><circle cx='22.00' cy='-22.00' r='1.2' fill='#3b3b3b'><title>counter</title></circle><text x='23.70' y='-23.30' class='lm-label'>counter</text><circle cx='6.00' cy='-13.00' r='1.2' fill='#3b3b3b'><title>tool_shelves</title></circle><text x='7.70' y='-14.30' class='lm-label'>tool_shelves</text><circle cx='39.00' cy='-13.00' r='1.2' fill='#3b3b3b'><title>rope_rack</title></circle><text x='40.70' y='-14.30' class='lm-label'>rope_rack</text><circle cx='6.00' cy='-19.00' r='1.2' fill='#3b3b3b'><title>candle_shelf</title></circle><text x='7.70' y='-20.30' class='lm-label'>candle_shelf</text><circle cx='22.00' cy='-29.00' r='1.2' fill='#3b3b3b'><title>back_door</title></circle><text x='23.70' y='-30.30' class='lm-label'>back_door</text><circle cx='22.00' cy='-45.00' r='1.2' fill='#3b3b3b'><title>garden_center</title></circle><text x='23.70' y='-46.30' class='lm-label'>garden_center</text><circle cx='22.00' cy='-29.00' r='1.2' fill='#3b3b3b'><title>garden_gate</title></circle><text x='23.70' y='-30.30' class='lm-label'>garden_gate</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
