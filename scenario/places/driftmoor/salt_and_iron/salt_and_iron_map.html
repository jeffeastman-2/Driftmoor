<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Salt And Iron — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-24.00 -89.00 119.00 113.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-16.00,16.00 87.00,16.00 87.00,-81.00 -16.00,-81.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='35.50' y='-32.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-0.00 71.00,-0.00 71.00,-45.00 0.00,-45.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='35.50' y='-22.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHOP_FLOOR</text><polygon points='0.00,-45.00 71.00,-45.00 71.00,-65.00 0.00,-65.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='35.50' y='-55.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>BACK_STORE</text><polygon points='19.00,-35.00 58.00,-35.00 58.00, case</text><circle cx='35.00' cy='-61.00' r='1.2' fill='#3b3b3b'><title>clock</title></circle><text x='36.70' y='-62.30' class='lm-label'>clock</text><circle cx='42.00' cy='-42.00' r='1.2' fill='#3b3b3b'><title>cudgel_under_counter</title></circle><text x='43.70' y='-43.30' class='lm-label'>cudgel_under_counter</text><circle cx='32.00' cy='-42.00' r='1.2' fill='#3b3b3b'><title>ledger</title></circle><text x='33.70' y='-43.30' class='lm-label'>ledger</text><circle cx='32.00' cy='-26.00' r='1.4' fill='#2ca02c' stroke='#111' stroke-width='0.35' data-tooltip='varrak - turn 0

zone=START</title></circle><rect x='33.20' y='-43.80' width='3.6' height='3.6' fill='white' stroke='#1f77b4' stroke-width='0.7'><title>jorgen start</title></rect><path d='M 33.20 -43.80 L 36.80 -40.20 M 36.80 -43.80 L 33.20 -40.20' stroke='#111' stroke-width='0.7'><title>jorgen end</title></path></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
