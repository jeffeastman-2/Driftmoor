<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Mayors Hall — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-17.00 -82.00 106.00 99.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-9.00,9.00 81.00,9.00 81.00,-74.00 -9.00,-74.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='36.00' y='-32.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-0.00 71.00,-0.00 71.00,-32.00 0.00,-32.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='35.50' y='-16.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>MAIN_HALL</text><polygon points='45.00,-22.00 71.00,-22.00 71.00,-39.00 45.00,-39.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='58.00' y='-30.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>OFFICE</text><polygon points='0.00,-32.00 32.00,-32.00 32.00,-65.00 0.00,-65.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='16.00' y='-48.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>RECORDS_ROOM</text><polygon points='32.00,-39.00 71.00,-39.00 71.00,-65.00 32.00,-65.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='51.50' y='-52.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>LIVING_QUARTERS</text><polygon points='0.00,-32.00 32.00,-32.00 32.00,-65.00 0.00,-65.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Records Room — Restricted</title></polygon><polygon points='0.00,-32.00 71.00,-32.00 71.00,-35.00 0.00,-35.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Hall back wall</title></polygon><polygon points='45.00,-22.00 45.00,-39.00 48.00,-39.00 48.00,-22.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Office divider</title></polygon><circle cx='35.00' cy='-0.00' r='1.2' fill='#3b3b3b'><title>main_entrance</title></circle><text x='36.70' y='-1.30' class='lm-label'>main_entrance</text><circle cx='35.00' cy='-16.00' r='1.2' fill='#3b3b3b'><title>great_table</title></circle><text x='36.70' y='-17.30' class='lm-label'>great_table</text><circle cx='6.00' cy='-16.00' r='1.2' fill='#3b3b3b'><title>hearth</title></circle><text x='7.70' y='-17.30' class='lm-label'>hearth</text><circle cx='9.00' cy='-3.00' r='1.2' fill='#3b3b3b'><title>notice_board</title></circle><text x='10.70' y='-4.30' class='lm-label'>notice_board</text><circle cx='52.00' cy='-22.00' r='1.2' fill='#3b3b3b'><title>office_door</title></circle><text x='53.70' y='-23.30' class='lm-label'>office_door</text><circle cx='58.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>mayor_desk</title></circle><text x='59.70' y='-33.30' class='lm-label'>mayor_desk</text><circle cx='26.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>records_door</title></circle><text x='27.70' y='-33.30' class='lm-label'>records_door</text><circle cx='16.00' cy='-45.00' r='1.2' fill='#3b3b3b'><title>filing_shelves</title></circle><text x='17.70' y='-46.30' class='lm-label'>filing_shelves</text><circle cx='65.00' cy='-45.00' r='1.2' fill='#3b3b3b'><title>staircase</title></circle><text x='66.70' y='-46.30' class='lm-label'>staircase</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
