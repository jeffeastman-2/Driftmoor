<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Bitter Remedy — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-17.00 -56.00 80.00 73.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='-9.00,9.00 55.00,9.00 55.00,-48.00 -9.00,-48.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='23.00' y='-19.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-0.00 45.00,-0.00 45.00,-22.00 0.00,-22.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='22.50' y='-11.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHOPFRONT</text><polygon points='0.00,-22.00 45.00,-22.00 45.00,-39.00 0.00,-39.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='22.50' y='-30.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>BACK_ROOM</text><polygon points='0.00,-22.00 45.00,-22.00 45.00,-39.00 0.00,-39.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Back Room — Restricted</title></polygon><polygon points='9.00,-13.00 35.00,-13.00 35.00,-16.00 9.00,-16.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Counter</title></polygon><polygon points='0.00,-22.00 45.00,-22.00 45.00,-26.00 0.00,-26.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Dividing wall</title></polygon><circle cx='22.00' cy='-0.00' r='1.2' fill='#3b3b3b'><title>front_door</title></circle><text x='23.70' y='-1.30' class='lm-label'>front_door</text><circle cx='22.00' cy='-13.00' r='1.2' fill='#3b3b3b'><title>counter</title></circle><text x='23.70' y='-14.30' class='lm-label'>counter</text><circle cx='6.00' cy='-9.00' r='1.2' fill='#3b3b3b'><title>herb_shelves_w</title></circle><text x='7.70' y='-10.30' class='lm-label'>herb_shelves_w</text><circle cx='39.00' cy='-9.00' r='1.2' fill='#3b3b3b'><title>herb_shelves_e</title></circle><text x='40.70' y='-10.30' class='lm-label'>herb_shelves_e</text><circle cx='19.00' cy='-16.00' r='1.2' fill='#3b3b3b'><title>mortar_pestle</title></circle><text x='20.70' y='-17.30' class='lm-label'>mortar_pestle</text><circle cx='22.00' cy='-22.00' r='1.2' fill='#3b3b3b'><title>back_room_door</title></circle><text x='23.70' y='-23.30' class='lm-label'>back_room_door</text><circle cx='22.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>experiment_table</title></circle><text x='23.70' y='-33.30' class='lm-label'>experiment_table</text><circle cx='39.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>volatile_shelf</title></circle><text x='40.70' y='-33.30' class='lm-label'>volatile_shelf</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
