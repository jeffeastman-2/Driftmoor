<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Azure Sea — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -27633.00 8141.00 27641.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 8125.00,-0.00 8125.00,-27625.00 0.00,-27625.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='4062.50' y='-13812.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='0.00,-0.00 7150.00,-0.00 7800.00,-10400.00 6500.00,-27625.00 0.00,-27625.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='4290.00' y='-13130.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>OPEN_WATER</text><polygon points='6500.00,-7475.00 8125.00,-7475.00 8125.00,-9425.00 6500.00,-9425.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='7312.50' y='-8450.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>HARBOR_APPROACH</text><polygon points='3900.00,-13000.00 6500.00,-13000.00 6500.00,-20150.00 3900.00,-20150.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='5200.00' y='-16575.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>TIDAL_ZONE</text><polygon points='2275.00,-13650.00 3575.00,-13650.00 3575.00,-14950.00 2275.00,-14950.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='2925.00' y='-14300.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>DROWNED_ISLE</text><polygon points='3250.00,-18200.00 4550.00,-18200.00 4550.00,-19500.00 3250.00,-19500.00' fill='#d8b48a' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='3900.00' y='-18850.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SEA_STACKS</text><polygon points='0.00,-0.00 7150.00,-0.00 7800.00,-10400.00 6500.00,-27625.00 0.00,-27625.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Open Water</title></polygon><polygon points='2275.00,-13000.00 6500.00,-13000.00 6500.00,-20150.00 2275.00,-20150.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Tidal Access Zone</title></polygon><polygon points='0.00,-0.00 4875.00,-0.00 4875.00,-10400.00 3250.00,-26000.00 0.00,-26000.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Open deep water</title></polygon><circle cx='2925.00' cy='-14300.00' r='1.2' fill='#3b3b3b'><title>drowned_isle</title></circle><text x='2926.70' y='-14301.30' class='lm-label'>drowned_isle</text><circle cx='3900.00' cy='-18850.00' r='1.2' fill='#3b3b3b'><title>sea_stacks_cluster</title></circle><text x='3901.70' y='-18851.30' class='lm-label'>sea_stacks_cluster</text><circle cx='7800.00' cy='-8450.00' r='1.2' fill='#3b3b3b'><title>harbor_mouth</title></circle><text x='7801.70' y='-8451.30' class='lm-label'>harbor_mouth</text><circle cx='2600.00' cy='-9750.00' r='1.2' fill='#3b3b3b'><title>deep_water_center</title></circle><text x='2601.70' y='-9751.30' class='lm-label'>deep_water_center</text><circle cx='5850.00' cy='-6500.00' r='1.2' fill='#3b3b3b'><title>coastal_shallows</title></circle><text x='5851.70' y='-6501.30' class='lm-label'>coastal_shallows</text><circle cx='4875.00' cy='-15600.00' r='1.2' fill='#3b3b3b'><title>tidal_flats</title></circle><text x='4876.70' y='-15601.30' class='lm-label'>tidal_flats</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
