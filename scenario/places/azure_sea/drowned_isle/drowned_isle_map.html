<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Drowned Isle — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -268.00 276.00 276.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 260.00,-0.00 260.00,-260.00 0.00,-260.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='130.00' y='-130.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SUBMERGED</text><polygon points='16.00,-16.00 243.00,-16.00 243.00,-243.00 16.00,-243.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='129.50' y='-129.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXPOSED_ROCK</text><polygon points='162.00,-81.00 227.00,-81.00 227.00,-146.00 162.00,-146.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='194.50' y='-113.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EASTERN_RUINS</text><polygon points='97.00,-130.00 130.00,-130.00 130.00,-162.00 97.00,-162.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='113.50' y='-146.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>TIDAL_POOL</text><polygon points='32.00,-97.00 97.00,-97.00 97.00,-178.00 32.00,-178.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='64.50' y='-137.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>WESTERN_RUINS</text><polygon points='0.00,-0.00 260.00,-0.00 260.00,-260.00 0.00,-260.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Tidal Submersion</title></polygon><polygon points='97.00,-130.00 130.00,-130.00 130.00,-162.00 97.00,-162.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Tidal pool</title></polygon><polygon points='39.00,-136.00 58.00,-136.00 58.00,-169.00 39.00,-169.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Collapsed walls</title></polygon><circle cx='130.00' cy='-130.00' r='1.2' fill='#3b3b3b'><title>isle_center</title></circle><text x='131.70' y='-131.30' class='lm-label'>isle_center</text><circle cx='113.00' cy='-146.00' r='1.2' fill='#3b3b3b'><title>tidal_pool</title></circle><text x='114.70' y='-147.30' class='lm-label'>tidal_pool</text><circle cx='195.00' cy='-113.00' r='1.2' fill='#3b3b3b'><title>eastern_ruins</title></circle><text x='196.70' y='-114.30' class='lm-label'>eastern_ruins</text><circle cx='65.00' cy='-130.00' r='1.2' fill='#3b3b3b'><title>western_ruins</title></circle><text x='66.70' y='-131.30' class='lm-label'>western_ruins</text><circle cx='188.00' cy='-107.00' r='1.2' fill='#3b3b3b'><title>barnacle_chest</title></circle><text x='189.70' y='-108.30' class='lm-label'>barnacle_chest</text><circle cx='227.00' cy='-32.00' r='1.2' fill='#3b3b3b'><title>landing_rocks</title></circle><text x='228.70' y='-33.30' class='lm-label'>landing_rocks</text><circle cx='130.00' cy='-162.00' r='1.2' fill='#3b3b3b'><title>highest_point</title></circle><text x='131.70' y='-163.30' class='lm-label'>highest_point</text><circle cx='81.00' cy='-162.00' r='1.2' fill='#3b3b3b'><title>collapsed_chamber</title></circle><text x='82.70' y='-163.30' class='lm-label'>collapsed_chamber</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
