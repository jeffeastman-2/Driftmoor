<!doctype html><html><head><meta charset='utf-8'><title>Driftmoor Interactive Map</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f5;color:#111;}.wrap{padding:12px 14px;}h1{font-size:16px;margin:0 0 8px 0;}p{margin:0 0 10px 0;font-size:13px;color:#333;}svg{width:min(1100px,98vw);height:auto;border:1px solid #c7c7c2;background:#fff;}.zone-label{font-size:5px;font-weight:700;fill:#1f1f1f;opacity:.8;}.lm-label{font-size:4.2px;fill:#333;}.item-label{font-size:3.8px;fill:#5a4a10;font-style:italic;}</style></head><body><div class='wrap'><h1>Sea Stacks — starting positions</h1><p>Hover over dots to see turn number, coordinates, and zone.</p><svg viewBox='-8.00 -333.00 406.00 341.00' preserveAspectRatio='xMidYMid meet'><style>.tooltip{position:relative;display:inline-block;}.tooltip .tooltiptext{visibility:hidden;width:120px;background-color:#222;color:#fff;text-align:center;border-radius:4px;padding:5px;position:absolute;z-index:1;bottom:125%;left:50%;margin-left:-60px;opacity:0;transition:opacity 0.3s;font-size:11px;line-height:1.3;white-space:pre-line;}.tooltip:hover .tooltiptext{visibility:visible;opacity:1;}</style><polygon points='0.00,-0.00 390.00,-0.00 390.00,-325.00 0.00,-325.00' fill='#3a5f3a' fill-opacity='0.180' stroke='#222' stroke-width='0.6'/><text x='195.00' y='-162.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>EXTERIOR</text><polygon points='32.00,-16.00 357.00,-16.00 357.00,-308.00 32.00,-308.00' fill='#c2a878' fill-opacity='0.400' stroke='#222' stroke-width='0.6'/><text x='194.50' y='-162.00' text-anchor='middle' dominant-baseline='middle' class='zone-label'>SHALLOWS</text><polygon points='162.00,-130.00 227.00,-130.00 227.00,-195.00 162.00,-195.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='194.50' y='-162.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>STACK_CENTRAL</text><polygon points='260.00,-146.00 325.00,-146.00 325.00,-211.00 260.00,-211.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='292.50' y='-178.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>STACK_EAST</text><polygon points='130.00,-227.00 195.00,-227.00 195.00,-292.00 130.00,-292.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='162.50' y='-259.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>STACK_NORTH</text><polygon points='97.00,-32.00 162.00,-32.00 162.00,-97.00 97.00,-97.00' fill='#7fbf7f' fill-opacity='0.300' stroke='#222' stroke-width='0.6'/><text x='129.50' y='-64.50' text-anchor='middle' dominant-baseline='middle' class='zone-label'>STACK_SOUTH</text><polygon points='32.00,-16.00 357.00,-16.00 357.00,-308.00 32.00,-308.00' fill='none' stroke='gold' stroke-width='1.1' stroke-dasharray='2.5,2.5'><title>Tidal Access</title></polygon><polygon points='139.00,-237.00 185.00,-237.00 185.00,-282.00 139.00,-282.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Stack North base</title></polygon><polygon points='172.00,-139.00 217.00,-139.00 217.00,-185.00 172.00,-185.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Stack Central</title></polygon><polygon points='107.00,-42.00 152.00,-42.00 152.00,-87.00 107.00,-87.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Stack South base</title></polygon><polygon points='269.00,-156.00 315.00,-156.00 315.00,-201.00 269.00,-201.00' fill='#4a4a4a' fill-opacity='0.65' stroke='#2a2a2a' stroke-width='0.6'><title>Stack East base</title></polygon><circle cx='162.00' cy='-260.00' r='1.2' fill='#3b3b3b'><title>stack_north</title></circle><text x='163.70' y='-261.30' class='lm-label'>stack_north</text><circle cx='195.00' cy='-162.00' r='1.2' fill='#3b3b3b'><title>stack_central</title></circle><text x='196.70' y='-163.30' class='lm-label'>stack_central</text><circle cx='130.00' cy='-65.00' r='1.2' fill='#3b3b3b'><title>stack_south</title></circle><text x='131.70' y='-66.30' class='lm-label'>stack_south</text><circle cx='292.00' cy='-178.00' r='1.2' fill='#3b3b3b'><title>stack_east</title></circle><text x='293.70' y='-179.30' class='lm-label'>stack_east</text><circle cx='178.00' cy='-266.00' r='1.2' fill='#3b3b3b'><title>nesting_ledge</title></circle><text x='179.70' y='-267.30' class='lm-label'>nesting_ledge</text><circle cx='227.00' cy='-130.00' r='1.2' fill='#3b3b3b'><title>shelter_cove</title></circle><text x='228.70' y='-131.30' class='lm-label'>shelter_cove</text><circle cx='97.00' cy='-162.00' r='1.2' fill='#3b3b3b'><title>tidal_passage</title></circle><text x='98.70' y='-163.30' class='lm-label'>tidal_passage</text></svg></div><script>document.addEventListener('DOMContentLoaded', function(){const circles = document.querySelectorAll('circle[data-tooltip]');circles.forEach(c => {c.style.cursor = 'pointer';c.addEventListener('mouseenter', function(e){const txt = e.target.getAttribute('data-tooltip');let tooltip = e.target.nextElementSibling;if(!tooltip || !tooltip.classList.contains('tooltiptext')) {tooltip = document.createElement('div');tooltip.className = 'tooltiptext';tooltip.style.pointerEvents = 'none';e.target.parentNode.insertBefore(tooltip, e.target.nextSibling);}tooltip.textContent = txt;tooltip.style.visibility = 'visible';tooltip.style.opacity = '1';});c.addEventListener('mouseleave', function(e){const tooltip = e.target.nextElementSibling;if(tooltip) {tooltip.style.visibility = 'hidden';tooltip.style.opacity = '0';}});});});</script></body></html>
